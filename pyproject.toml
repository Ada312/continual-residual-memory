[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-residual-memory"
version = "0.1.0"
description = "Continual Residual Memory for speech enhancement"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["crm*", "backbones*"]

[tool.ruff]
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/backbones/cmgan/transforms/__init__.py" = ["F401", "F403"]
"metrics/_frozen/*.py" = ["F401", "F841"]
